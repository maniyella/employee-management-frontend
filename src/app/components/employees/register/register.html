<div class="container mt-4">
    <h4 class="text-center">Register Employee</h4>
    <form [formGroup]="registerForm" (ngSubmit)="registerEmp(registerForm.value)">
        <div class="m-3">
            <label for="" class="mb-2">Name:</label>
            <input type="text" formControlName="name" class="form-control" placeholder="Enter name" autocomplete="off">
            <div class="m-2 text-danger" *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.hasError('required')">Name is required</div>
        </div>
        <div class="m-3">
            <label for="" class="mb-2">Email:</label>
            <input type="email" formControlName="email" class="form-control" placeholder="Enter email">
            <div class="m-2 text-danger" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required')">Email is required</div>
            <div class="m-2 text-danger" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">Invalid email format</div>
        </div>
        <div class="m-3">
            <label for="" class="mb-2">Mobile Number:</label>
            <input type="text" formControlName="mobile" minlength="10" maxlength="10" pattern="[0-9]*" class="form-control" placeholder="Enter mobile number">
            <div class="m-2 text-danger" *ngIf="registerForm.get('mobile')?.touched && registerForm.get('mobile')?.hasError('required')">Mobile number is required</div>
            <div class="m-2 text-danger" *ngIf="registerForm.get('mobile')?.touched && registerForm.get('mobile')?.hasError('pattern')">Invalid mobile number</div>
        </div>
        <div class="m-3">
            <label for="" class="mb-2">Salary:</label>
            <input type="number" formControlName="salary" class="form-control" autocomplete="off">
            <div class="m-2 text-danger" *ngIf="registerForm.get('salary')?.touched && registerForm.get('salary')?.hasError('required')">Salary is required</div>
            <div class="m-2 text-danger" *ngIf="registerForm.get('salary')?.touched && registerForm.get('salary')?.hasError('min')">Salary must be a positive number</div>
        </div>
        <div class="success m-3">
            <button class="btn btn-success" type="submit" [disabled]="registerForm.invalid">Submit</button>
        </div>
    </form>
</div>
