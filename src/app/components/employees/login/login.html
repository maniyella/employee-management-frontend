<div class="container">
    <form [formGroup]="loginForm" (ngSubmit)="loginFormData(loginForm.value)">
        <div class="form-group m-3">
            <label for="user">Username</label>
            <input type="text" class="form-control" id="user" formControlName="username">
        </div>
        <div class="form-group m-3">
            <label for="password">Password</label>
            <input type="password" minLength="8" maxLength="30"class="form-control" id="password" formControlName="password">
            <div class="text-danger m-3" *ngIf="loginForm.controls['password']?.hasError('pattern')">
                Password must be at least 8 characters long and contain at least 1 uppercase letter, 1 lowercase letter,11 number, and 1 special character.
            </div>
        </div>
        <div class="form-group m-3">
            <button type="submit" class="btn btn-info w-50" [disabled]="!loginForm.valid">Login</button>
        </div>
    </form>
</div>
